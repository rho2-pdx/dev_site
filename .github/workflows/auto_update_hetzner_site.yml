name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/dev_site
            git pull origin main
            # Cookery recipes live in CookeryData.sql. Postgres init scripts only
            # run on an empty data volume, so recreate that volume on each deploy.
            docker compose stop cookery cookery-db || true
            docker compose rm -fs cookery-db || true
            db_volume="$(docker volume ls -q --filter name=cookery-db-data | head -n1)"
            if [ -n "$db_volume" ]; then
              docker volume rm "$db_volume"
            fi
            docker compose up -d --build
            docker compose restart nginx
