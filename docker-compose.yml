services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./shared-assets:/var/www/shared-assets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - nextjs
      - poem-generator
      - airline-web
      - cookery
    restart: unless-stopped

  nextjs:
    build: .
    expose:
      - "3000"
    restart: unless-stopped

  poem-generator:
    build: ./projects/poem-generator
    expose:
      - "5000"
    env_file:
      - ./projects/poem-generator/.env
    volumes:
      - ./projects/poem-generator/google-credentials.json:/app/google-credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
    restart: unless-stopped

  airline-web:
    build: ./projects/airline-web
    expose:
      - "8080"
    restart: unless-stopped

  cookery-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cookery
      - POSTGRES_PASSWORD=cookery
      - POSTGRES_DB=cookery
    volumes:
      - cookery-db-data:/var/lib/postgresql/data
      - ./projects/cookery/CookeryData.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  cookery:
    build: ./projects/cookery
    expose:
      - "8081"
    environment:
      - DATABASE_URL=postgres://cookery:cookery@cookery-db:5432/cookery
      - COOKERY_RECIPE_TABLE=${COOKERY_RECIPE_TABLE:-recipes}
      - PORT=8081
    depends_on:
      - cookery-db
    restart: unless-stopped

volumes:
  cookery-db-data:
