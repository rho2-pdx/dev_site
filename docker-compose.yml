services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./shared-assets:/var/www/shared-assets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - nextjs
      - poem-generator
      - airline-web
      - cookery
    restart: unless-stopped

  nextjs:
    build: .
    expose:
      - "3000"
    restart: unless-stopped

  poem-generator:
    build: ./projects/poem-generator
    expose:
      - "5000"
    env_file:
      - ./projects/poem-generator/.env
    volumes:
      - ./projects/poem-generator/google-credentials.json:/app/google-credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
    restart: unless-stopped

  airline-web:
    build: ./projects/airline-web
    expose:
      - "8080"
    restart: unless-stopped

  cookery-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cookery
      - POSTGRES_PASSWORD=cookery
      - POSTGRES_DB=cookery
    volumes:
      - cookery-db-data:/var/lib/postgresql/data
      # Postgres only runs these on first init of an empty volume.
      # Deploy wipes cookery-db-data so CookeryData.sql stays the source of truth.
      - ./projects/cookery/db-init/00-create-cook-role.sql:/docker-entrypoint-initdb.d/00-create-cook-role.sql:ro
      - ./projects/cookery/CookeryData.sql:/docker-entrypoint-initdb.d/01-CookeryData.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U cookery -d cookery && psql -U cookery -d cookery -c 'SELECT 1 FROM frecipe LIMIT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 15s
    restart: unless-stopped

  cookery:
    build: ./projects/cookery
    expose:
      - "8081"
    environment:
      - DATABASE_URL=postgres://cookery:cookery@cookery-db:5432/cookery
      - COOKERY_RECIPE_TABLE=${COOKERY_RECIPE_TABLE:-recipes}
      - PORT=8081
    depends_on:
      cookery-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cookery-db-data:
