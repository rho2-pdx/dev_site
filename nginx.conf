events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Don't advertise nginx version
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    upstream nextjs {
        server nextjs:3000;
    }

    upstream poem-generator {
        server poem-generator:5000;
    }

    upstream airline-web {
        server airline-web:8080;
    }

    upstream cookery {
        server cookery:8081;
    }

    # Requests for unknown hostnames (e.g. scanners hitting the bare IP):
    # drop them, and refuse the TLS handshake so no certificate (and thus no
    # hostname) is revealed.
    server {
        listen 80 default_server;
        return 444;
    }

    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    # Redirect HTTP to HTTPS (except Let's Encrypt HTTP-01 challenges)
    server {
        listen 80;
        server_name houlberg.dev www.houlberg.dev photos.houlberg.dev;

        # certbot --webroot writes challenge files here (host /var/www/certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name houlberg.dev www.houlberg.dev;

        ssl_certificate /etc/letsencrypt/live/houlberg.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/houlberg.dev/privkey.pem;

        # Only accept traffic that comes through Cloudflare (orange cloud), so
        # nobody can bypass it by hitting the VPS IP directly.
        # Ranges from https://www.cloudflare.com/ips/ (check occasionally).
        # !! If houlberg.dev is ever switched to "DNS only" (grey cloud),
        # !! remove this allow/deny list or the site will 403 everyone.
        allow 173.245.48.0/20;
        allow 103.21.244.0/22;
        allow 103.22.200.0/22;
        allow 103.31.4.0/22;
        allow 141.101.64.0/18;
        allow 108.162.192.0/18;
        allow 190.93.240.0/20;
        allow 188.114.96.0/20;
        allow 197.234.240.0/22;
        allow 198.41.128.0/17;
        allow 162.158.0.0/15;
        allow 104.16.0.0/13;
        allow 104.24.0.0/14;
        allow 172.64.0.0/13;
        allow 131.0.72.0/22;
        allow 2400:cb00::/32;
        allow 2606:4700::/32;
        allow 2803:f800::/32;
        allow 2405:b500::/32;
        allow 2405:8100::/32;
        allow 2a06:98c0::/29;
        allow 2c0f:f248::/32;
        deny all;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Let's Encrypt challenges, in case Cloudflare upgrades the
        # validation request to https before it reaches us
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Shared design assets for all containerized apps
        location /shared/ {
            alias /var/www/shared-assets/;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # --- Project routes ---

        location = /projects/poem-generator {
            return 301 /projects/poem-generator/;
        }

        location /projects/poem-generator/ {
            proxy_pass http://poem-generator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /projects/poem-generator;
            client_max_body_size 0;
        }

        location = /projects/airline-web {
            return 301 /projects/airline-web/;
        }

        location /projects/airline-web/ {
            proxy_pass http://airline-web/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /projects/cookery {
            return 301 /projects/cookery/;
        }

        location /projects/cookery/ {
            proxy_pass http://cookery/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else goes to Next.js
        location / {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # copyparty file server on deb, reached over tailscale.
    # photos.houlberg.dev is "DNS only" in Cloudflare (grey cloud) so large
    # downloads don't go through Cloudflare. Keep it IPv4-only (no AAAA):
    # docker's IPv6 proxy would hide client IPs from copyparty's login bans.
    server {
        listen 443 ssl;
        server_name photos.houlberg.dev;

        ssl_certificate /etc/letsencrypt/live/photos.houlberg.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/photos.houlberg.dev/privkey.pem;

        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            # copyparty serves https with a self-signed cert; the hop is
            # already encrypted by tailscale (wireguard), so don't verify it
            proxy_pass https://100.127.187.85:3923;
            proxy_ssl_verify off;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            # Overwrite (don't append to) anything the client sent; copyparty
            # trusts this header only from the VPS (xff-src) and bans per-IP
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;

            # Stream big uploads/downloads instead of spooling them to disk
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
