events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Don't advertise nginx version
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    upstream nextjs {
        server nextjs:3000;
    }

    upstream poem-generator {
        server poem-generator:5000;
    }

    upstream airline-web {
        server airline-web:8080;
    }

    upstream cookery {
        server cookery:8081;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name houlberg.dev www.houlberg.dev;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name houlberg.dev www.houlberg.dev;

        ssl_certificate /etc/letsencrypt/live/houlberg.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/houlberg.dev/privkey.pem;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Shared design assets for all containerized apps
        location /shared/ {
            alias /var/www/shared-assets/;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # --- Project routes ---

        location = /projects/poem-generator {
            return 301 /projects/poem-generator/;
        }

        location /projects/poem-generator/ {
            proxy_pass http://poem-generator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /projects/poem-generator;
            client_max_body_size 0;
        }

        location = /projects/airline-web {
            return 301 /projects/airline-web/;
        }

        location /projects/airline-web/ {
            proxy_pass http://airline-web/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /projects/cookery {
            return 301 /projects/cookery/;
        }

        location /projects/cookery/ {
            proxy_pass http://cookery/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else goes to Next.js
        location / {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
